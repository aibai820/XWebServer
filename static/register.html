<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - My WebServer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 380px;
            width: 90%;
        }
        h1 { font-size: 24px; color: #333; margin-bottom: 24px; }
        input {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin: 12px 0;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .back { display: block; margin-top: 16px; color: #888; font-size: 13px; text-decoration: none; }
        .back:hover { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🆕 注册新账户</h1>
        <form action="3CGISQL.cgi" method="post">
            <input type="text" name="user" placeholder="用户名" required autocomplete="username">
            <input type="password" name="password" placeholder="密码" required autocomplete="new-password">
            <button type="submit">注册</button>
        </form>
        <a href="/" class="back">← 返回首页</a>
    </div>
</body>
</html>
