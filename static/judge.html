<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WebServer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .btn-login {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        .divider {
            margin: 24px 0;
            color: #ccc;
            font-size: 13px;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: #eee;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .footer {
            margin-top: 24px;
            font-size: 11px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 My WebServer</h1>
        <p class="subtitle">Phase 4 — 生产级高并发 HTTP 服务器</p>

        <form action="0" method="post">
            <button type="submit" class="btn btn-register">🆕 新用户注册</button>
        </form>

        <form action="1" method="post">
            <button type="submit" class="btn btn-login">🔑 已有账户登录</button>
        </form>

        <p class="footer">epoll + 线程池 + 定时器 + 异步日志 + MySQL</p>
    </div>
</body>
</html>
